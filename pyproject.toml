[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbr-mcp-server"
version = "0.1.0"
description = "Case-Based Reasoning MCP Server for SBCF"
authors = [
    {name = "SBCF Team", email = "team@sbcf.com"}
]
dependencies = [
    "mcp",
    "chromadb",
    "sentence-transformers",
    "pydantic",
    "einops"
]
requires-python = ">=3.10"

[project.scripts]
cbr-mcp-server = "cbr_mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cbr_mcp_server*", "retriever*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:sqlite3",
    "ignore:The default datetime adapter is deprecated:DeprecationWarning"
]