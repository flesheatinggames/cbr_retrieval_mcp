[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbr-mcp-server"
version = "0.1.0"
description = "Case-Based Reasoning MCP Server"
authors = [
    {name = "Travis Williams", email = "flesheatinggames@gmail.com"}
]
dependencies = [
    "mcp",
    "chromadb==1.3.7", # Pinned to avoid Rust bindings bug
    "sentence-transformers",
    "pydantic",
    "einops",
    "psutil",
    "cachetools>=5.3.0",
]
requires-python = ">=3.10"

[project.scripts]
cbr-mcp-server = "cbr_mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "memory_profiler",
    "black",
    "isort",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cbr_mcp_server*", "retriever*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "-m", "not load"
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlite3",
    "ignore:The default datetime adapter is deprecated:DeprecationWarning"
]
markers = [
    "unit: Unit tests for individual components",
    "load: Load and stress tests (5+ minute duration)",
    "slow: Slow tests (>30 seconds)",
    "memory: Memory measurement tests (must run serially)",
    "serial: marks tests that must run serially (not in parallel)"
]
